name: circlo
description: Circlo - private, consent-based location sharing for families and friends.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  geolocator: '>=13.0.0 <15.0.0'
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  http: ^1.2.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
